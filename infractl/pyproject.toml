[project]
name = "infractl"
version = "0.1.0"
description = "shared-infra control plane — single writer, ledger, probes, heal rules, API, CLI, UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "typer>=0.13",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
infractl = "infractl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["infractl*"]

[tool.pytest.ini_options]
markers = [
    "live: requires a running infractl API / docker / bifrost stack",
]
testpaths = ["tests"]
