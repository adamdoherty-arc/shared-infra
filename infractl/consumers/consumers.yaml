# Consumer registry for the shared infrastructure (source of truth for
# docs/CONSUMERS.md, /api/consumers and the synthetic per-VK probe).
# VK ids are the Bifrost virtual-key UUIDs in bifrost/config.db; the key VALUES
# never appear here. sha256_prefix = first 16 hex of sha256(value) so a process
# can prove which key it holds without printing it.
version: 1
network: shared-infra_default
gateway:
  url_internal: http://shared-bifrost:8080
  url_host: http://127.0.0.1:4445
  image: maximhq/bifrost:v2.0.0
consumers:
  - name: ada
    vk_name: ada-prod
    vk_id: 390e12e3-78f6-4c78-8e62-309cf20e40c3
    sha256_prefix: 2ea3a14abec0391e
    repo: C:\code\ADA
    legion_project_id: 5
    env_var: BIFROST_API_KEY
    containers: [ada-backend, ada-agent, ada-scheduler, ada-arq-worker]
    health_url: http://127.0.0.1:8006/api/health
    daily_request_budget: 130000
    per_minute_cap: 400
    vllm_local_share: 0.70
    notes: largest consumer (~113k req / 33M tokens per day); LOCAL-first task classifier
  - name: legion
