# Grafana Tempo — shared-infra trace store (replaces jaegertracing/all-in-one,
# Jaeger v1, EOL). Receives OTLP spans from otelcol (shared-tempo:4317 internal)
# after tail sampling. Local filesystem block store; 48h block retention matches
# the old Jaeger badger TTL (BADGER_SPAN_STORE_TTL=48h). Query API on :3200 for
# the Grafana Tempo datasource (http://shared-tempo:3200).
#
# Bring up:
#   docker compose -p shared-infra -f docker-compose.observability.yml up -d shared-tempo
# Readiness:  curl -s http://localhost:3200/ready   -> "ready"

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Cut a block every 5 min so recent traces are queryable quickly.
  max_block_duration: 5m

compactor:
  compaction:
    # 48h retention — matches the retired Jaeger badger span TTL. Pyroscope +
    # Prometheus carry long-term observability; Tempo only needs recent traces
    # for live debugging.
    block_retention: 48h

# metrics_generator intentionally OFF (optional). Span-metrics / service-graphs
# are not generated here — Prometheus already carries the RED metrics and enabling
# the generator would require a remote_write target. Leaving it unconfigured
# disables it by default.

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
