# Shared observability stack (Infra-50) — ONE Prometheus + Grafana + Tempo +
# Alertmanager for the WHOLE ecosystem, replacing the duplicated per-project
# legion-* / ada-* monitoring containers (8 containers -> 4). Lives on
# shared-infra_default so it scrapes every project backend by container DNS.
# Per-project datastores (Postgres/Redis/Qdrant/Neo4j) stay isolated.
#
# STATUS: CUTOVER COMPLETE (2026-05-27). Jaeger v1 -> Grafana Tempo (2026-07-07).
#   - legion + ada prometheus/grafana/alertmanager blocks removed from their
#     compose files; both backends' OTLP exporters point at otelcol, which
#     tail-samples and forwards spans to shared-tempo:4317.
#   - This stack owns the final ports: Prometheus 9099, Grafana 3050,
#     Tempo 3200 (query API), Alertmanager 9095. (Jaeger's 16700/4317/4318
#     retired — host 4317/4318 now free; otelcol ingests on host 4321/4322.)
#   - Scrapes legion-backend, ada-backend, ada-postgres-exporter (via host),
#     bifrost-metrics, vllm-chat, vllm-embed. Zero has no Prometheus endpoint
#     yet (commented in prometheus.yml — re-enable when it mounts prometheus_client).
#   - 14 dashboards provisioned (Legion folder x6, ADA folder x8); 83 alert
#     rules; Alertmanager routes to Legion's webhook receiver.
#
# Bring up:  docker compose -p shared-infra -f docker-compose.observability.yml up -d

services:
  shared-prometheus:
    image: prom/prometheus:latest
    container_name: shared-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9099:9090"   # Legion's freed Prometheus port (final)
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - shared-prometheus-data:/prometheus
    networks:
      - shared-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits: { memory: 768M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  shared-alertmanager:
    image: prom/alertmanager:latest
    container_name: shared-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9095:9093"   # Legion's freed alertmanager port
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - shared-infra
    deploy:
      resources:
        limits: { memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  shared-tempo:
    # Grafana Tempo — replaces jaegertracing/all-in-one (Jaeger v1, EOL).
    # otelcol tail-samples spans and forwards them here over OTLP gRPC
    # (shared-tempo:4317, internal only — host 4317/4318 are now free). Local
    # filesystem block store, 48h block retention (matches the old badger TTL).
    # Config: ./otelcol/tempo.yaml. Query API on :3200 (Grafana Tempo datasource).
    image: grafana/tempo:2.9.0   # pinned (was jaeger all-in-one:latest); 2.9.0 = current stable
    container_name: shared-tempo
    restart: unless-stopped
    # Run as root so Tempo can create wal/blocks dirs on the fresh named volume
    # (matches the retired Jaeger config — non-root hits mkdir permission denied).
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"     # Tempo HTTP API (query + /ready) — Grafana + host verify
    volumes:
      - ./otelcol/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - shared-tempo-data:/var/tempo
    networks:
      - shared-infra
    deploy:
      resources:
        limits: { memory: 1G }
    # No HEALTHCHECK — grafana/tempo ships without wget/curl (like otelcol/loki).
    # Liveness: curl http://localhost:3200/ready from host returns "ready" when up.

  shared-grafana:
    image: grafana/grafana:latest
    container_name: shared-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3050:3000"   # Legion's freed Grafana port (final)
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - shared-grafana-data:/var/lib/grafana
    networks:
      - shared-infra
    depends_on:
      - shared-prometheus
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  shared-infra:
    external: true
    name: shared-infra_default

volumes:
  shared-prometheus-data:
  shared-grafana-data:
  shared-tempo-data:
