# Shared observability stack (Infra-50) — ONE Prometheus + Grafana + Tempo +
# Alertmanager for the WHOLE ecosystem, replacing the duplicated per-project
# legion-* / ada-* monitoring containers (8 containers -> 4). Lives on
# shared-infra_default so it scrapes every project backend by container DNS.
# Per-project datastores (Postgres/Redis/Qdrant/Neo4j) stay isolated.
#
# STATUS: CUTOVER COMPLETE (2026-05-27). Jaeger v1 -> Grafana Tempo (2026-07-07).
#   - legion + ada prometheus/grafana/alertmanager blocks removed from their
#     compose files; both backends' OTLP exporters point at otelcol, which
#     tail-samples and forwards spans to shared-tempo:4317.
#   - This stack owns the final ports: Prometheus 9099, Grafana 3050,
#     Tempo 3200 (query API), Alertmanager 9095. (Jaeger's 16700/4317/4318
#     retired — host 4317/4318 now free; otelcol ingests on host 4321/4322.)
#   - Scrapes legion-backend, ada-backend, ada-postgres-exporter (via host),
#     bifrost-metrics, vllm-chat, vllm-embed. Zero has no Prometheus endpoint
#     yet (commented in prometheus.yml — re-enable when it mounts prometheus_client).
#   - 14 dashboards provisioned (Legion folder x6, ADA folder x8); 83 alert
#     rules; Alertmanager routes to Legion's webhook receiver.
#
# Bring up:  docker compose -p shared-infra -f docker-compose.observability.yml up -d

services:
  shared-prometheus:
    image: prom/prometheus:latest
    container_name: shared-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9099:9090"   # Legion's freed Prometheus port (final)
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - shared-prometheus-data:/prometheus
    networks:
      - shared-infra
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits: { memory: 768M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  shared-alertmanager:
    image: prom/alertmanager:latest
    container_name: shared-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9095:9093"   # Legion's freed alertmanager port
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - shared-infra
    deploy:
      resources:
        limits: { memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  shared-tempo:
    # Grafana Tempo — replaces jaegertracing/all-in-one (Jaeger v1, EOL).
    # otelcol tail-samples spans and forwards them here over OTLP gRPC
    # (shared-tempo:4317, internal only — host 4317/4318 are now free). Local
    # filesystem block store, 48h block retention (matches the old badger TTL).
    # Config: ./otelcol/tempo.yaml. Query API on :3200 (Grafana Tempo datasource).
    image: grafana/tempo:2.9.0   # pinned (was jaeger all-in-one:latest); 2.9.0 = current stable
    container_name: shared-tempo
    restart: unless-stopped
    # Run as root so Tempo can create wal/blocks dirs on the fresh named volume
    # (matches the retired Jaeger config — non-root hits mkdir permission denied).
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"     # Tempo HTTP API (query + /ready) — Grafana + host verify
    volumes:
      - ./otelcol/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - shared-tempo-data:/var/tempo
    networks:
      - shared-infra
    deploy:
      resources:
        limits: { memory: 1G }
    # No HEALTHCHECK — grafana/tempo ships without wget/curl (like otelcol/loki).
    # Liveness: curl http://localhost:3200/ready from host returns "ready" when up.

  shared-grafana:
    image: grafana/grafana:latest
    container_name: shared-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3050:3000"   # Legion's freed Grafana port (final)
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - shared-grafana-data:/var/lib/grafana
    networks:
      - shared-infra
    depends_on:
      - shared-prometheus
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────
  # dcgm-exporter (Phase 3 item 2, 2026-08-04): RTX 5090 GPU telemetry. The
  # card ran completely blind before this — no exporter, nothing scraping it.
  # Validated manually on THIS host before wiring in: `docker run --gpus all
  # nvidia/dcgm-exporter` boots clean via the `nvidia` container runtime
  # (docker info already lists it) and reports real DCGM_FI_DEV_FB_USED/FREE,
  # GPU_UTIL, GPU_TEMP, POWER_USAGE for "NVIDIA GeForce RTX 5090" — no
  # nvidia_gpu_exporter or host-side nvidia-smi-to-pushgateway fallback was
  # needed. Pinned by digest; the `latest` tag resolved to DCGM
  # Version=4.6.0-4.8.3 at pin time (2026-08-04).
  dcgm-exporter:
    image: nvidia/dcgm-exporter@sha256:613ab03c11d442fd960ff515f547e9921537454a712d08160bc8f677f89f1c35
    container_name: dcgm-exporter
    restart: unless-stopped
    ports:
      - "9400:9400"
    networks:
      - shared-infra
    deploy:
      resources:
        limits: { memory: 256M }
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # No HEALTHCHECK — the nvidia/dcgm-exporter image has no wget/curl/nc/sh
    # tool to exec a probe with (verified: `docker exec dcgm-exporter which
    # wget` -> "executable file not found in $PATH"; same class of image as
    # grafana/tempo/otelcol/loki above, which already document this pattern
    # in this file). Liveness = Prometheus's own `up{job="dcgm-exporter"}`
    # scrape-health signal, not a container-level probe.

  # ─────────────────────────────────────────────────────────────────────────
  # cadvisor (Phase 3 item 2, 2026-08-04): per-container CPU/memory/IO for
  # the whole ecosystem. Nothing scraped this before (confirmed: no
  # cadvisor/node-exporter container existed anywhere on this host) even
  # though legion_alert_rules.yml / legion_ecosystem.yml already reference
  # container_cpu_usage_seconds_total / container_memory_usage_bytes — those
  # alert rules have been silently dead (never evaluated, metric never
  # existed) until this container exists. This ALSO makes them real.
  # Windows/Docker-Desktop notes (validated on this host 2026-08-04):
  #   - v0.49.1 FAILS here: Docker Desktop's containerd image-store
  #     snapshotter doesn't use the classic overlayfs/layerdb layout v0.49.1
  #     expects ("failed to identify the read-write layer ID for container
  #     ..."). v0.55.1 (current `latest` at pin time) handles it cleanly —
  #     do NOT pin back to an older tag without re-verifying.
  #   - Docker Desktop PROXIES /var/run/docker.sock (container inspect shows
  #     desktop.docker.io/binds/0/SourceKind=dockerSocketProxied). That
  #     blocks cAdvisor's Docker-factory container-metadata enrichment, so
  #     `name=`/`image=` Prometheus labels stay empty. The RAW cgroup
  #     factory still reports full real per-container series keyed by
  #     container ID (verified: id="/docker/<ada-backend's real 64-char
  #     container ID>" carried correct live cpu/memory/blkio numbers cross-
  #     checked against `docker inspect ada-backend`). Dashboard/alert
  #     queries join on that ID, not on a name label.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "9500:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - shared-infra
    deploy:
      resources:
        limits: { memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  shared-infra:
    external: true
    name: shared-infra_default

volumes:
  shared-prometheus-data:
  shared-grafana-data:
  shared-tempo-data:
