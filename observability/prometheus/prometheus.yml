# Shared observability — single Prometheus for the whole ecosystem (Infra-50).
#
# All project backends already join the shared-infra_default network, so ONE
# Prometheus scrapes them by container DNS name + INTERNAL container port (not
# host port). This replaces the per-project legion-prometheus + ada-prometheus.
# Per-project datastores stay isolated — only observability is shared.
#
# Each job stamps ecosystem_project so Grafana/Alertmanager can route per project.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: shared-ecosystem

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['shared-alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels: { ecosystem_project: shared }

  - job_name: legion-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['legion-backend:8005']
        labels: { ecosystem_project: legion }

  - job_name: ada-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['ada-backend:8003']
        labels: { ecosystem_project: ada }

  # ada-postgres-exporter stays on ada-network (it scrapes ADA's native host
  # Postgres), so reach it via the host port mapping rather than container DNS.
  - job_name: ada-postgres-exporter
    static_configs:
      - targets: ['host.docker.internal:9187']
        labels: { ecosystem_project: ada }

  - job_name: bifrost-metrics
    static_configs:
      - targets: ['bifrost-metrics:9100']
        labels: { ecosystem_project: shared }

  # Pass-9 (2026-08-31, Migration-20): job name kept as vllm-chat so every
  # existing Grafana panel/alert keyed on job="vllm-chat" continues across the
  # engine swap; the target is the qwen38-chat container (syv-ai Qwen3.8-27B
  # stack) which replaced the Nemotron vllm-chat service.
  - job_name: vllm-chat
    metrics_path: /metrics
    static_configs:
      - targets: ['qwen38-chat:18020']
        labels: { ecosystem_project: shared }

  - job_name: vllm-embed
    metrics_path: /metrics
    static_configs:
      - targets: ['vllm-embed:8001']
        labels: { ecosystem_project: shared }

  # qwen3-rerank (2026-09-25): CPU reranker service, --metrics exposes the
  # same llama.cpp /metrics surface as vllm-embed.
  - job_name: qwen3-rerank
    metrics_path: /metrics
    static_configs:
      - targets: ['qwen3-rerank:8002']
        labels: { ecosystem_project: shared }

  # Bifrost's own /metrics (v2.2+): per-VK error_type (policy_rate_limited =
  # a consumer hit its bifrost/vk-rate-limits.json cap; policy_model_blocked =
  # a consumer asked for a model its VK does not allow). Complements the
  # log-store exporter above. Empty enterprise labels and the per-key bucket
  # families (~16k series) are dropped; bifrost-metrics owns latency histograms.
  - job_name: bifrost-native
    metrics_path: /metrics
    static_configs:
      - targets: ['shared-bifrost:8080']
        labels: { ecosystem_project: shared }
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'bifrost_(upstream_latency_seconds|request_retries|stream_first_token_latency_seconds|stream_inter_token_latency_seconds)_bucket'
        action: drop
      - regex: '(business_unit|customer|team|project|routing|complexity)_.*|alias|selected_key_id|routing_engine_used'
        action: labeldrop

  # Phase 3 item 2 (2026-08-04): RTX 5090 GPU telemetry — was completely
  # unscraped before this. See docker-compose.observability.yml for the
  # dcgm-exporter service block + why DCGM (not nvidia_gpu_exporter or a
  # host-side fallback) is what actually works on this host.
  - job_name: dcgm-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ['dcgm-exporter:9400']
        labels: { ecosystem_project: shared }

  # Phase 3 item 2 (2026-08-04): per-container CPU/memory/IO. Also makes the
  # pre-existing container_cpu_usage_seconds_total / container_memory_usage_bytes
  # alert rules in legion_alert_rules.yml / legion_ecosystem.yml evaluate for
  # real for the first time (metric never existed before).
  - job_name: cadvisor
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
        labels: { ecosystem_project: shared }

  # Zero exposes a JSON business-metrics summary at /metrics, NOT Prometheus
  # exposition — it has no scrape target until it mounts prometheus_client.
  # Re-enable once Zero ships a real /metrics endpoint.
  # - job_name: zero-api
  #   static_configs:
  #     - targets: ['zero-api:18792']
  #       labels: { ecosystem_project: zero }
