# Bifrost logs store size alerts — Perf-503b Wave 3b Workstream 4 (2026-07-13).
# Updated 2026-09-22 (Legion-Task 15016): the store moved SQLite -> Postgres.
#
# ORIGINAL (SQLite, 2026-07-13 - 2026-09-22): logs.db was Bifrost's SQLite
# request-log file, unbounded, and it corrupted twice (8.3 GB on 2026-06-11,
# "malformed database disk image" at 26 GB on 2026-07-09) before the
# bifrost-logs-pruner sidecar's nightly DELETE + VACUUM (2d retention) kept
# it near a 9 GB steady-state.
#
# CURRENT (Postgres, since 2026-09-22): the Windows-bind-mounted SQLite file
# did not share POSIX locks across containers (9p mount), which caused a
# lock-storm class of failure (measured: repeated "database is locked" /
# "context deadline exceeded" on Bifrost's own housekeeping, 186+ ADA-side
# 503 request_dropped). logs_store.type is now "postgres" in
# shared-infra/bifrost/config.json (dedicated `bifrost` role, `bifrost_logs`
# database, same native PG server ADA/Legion/Zero share). Retention (2d) is
# now enforced by Bifrost's OWN internal retention cleaner, not the external
# pruner — bifrost-logs-pruner is parked (`profiles: ["sqlite-rollback"]` in
# docker-compose.bifrost.yml) and only relevant again if this is rolled back.
# `bifrost_logs_db_bytes` is exported the same way as before
# (bifrost-metrics-exporter/exporter.py), but now reads
# `SELECT pg_database_size('bifrost_logs')` instead of a file stat — the
# metric name and this alert's thresholds are unchanged because a stuck
# retention cleaner or a traffic spike is worth exactly the same kind of
# early warning regardless of which engine holds the data. Postgres will not
# corrupt at a fixed byte threshold the way that SQLite file did, but
# unbounded growth still means unbounded disk use on the shared native PG
# server every other project's data lives on — the CRITICAL runbook below
# reflects that difference explicitly.
#
# Exported by bifrost-metrics (shared-infra/bifrost-metrics-exporter/exporter.py)
# as a plain gauge in bytes; scraped by both shared-prometheus (job
# bifrost-metrics, container DNS) and ada-prometheus (job bifrost, via
# host.docker.internal:9102) — this rule fires on either since the metric
# name carries no job-specific label requirement.
#
# Thresholds (unchanged from the SQLite era pending real Postgres growth data):
#   Warn (5 GB / 30m)     — comfortably above the ~9 GB SQLite-era steady-state;
#                            worth a look before it compounds.
#   Critical (15 GB / 5m) — past the intended steady-state. Page now and check
#                            the internal retention cleaner, not a pruner sidecar.
groups:
  - name: bifrost_logs_db
    interval: 30s
    rules:
      - alert: BifrostLogsDbSizeWarn
        expr: bifrost_logs_db_bytes > 5 * 1024 * 1024 * 1024
        for: 30m
        labels:
          severity: warning
          component: bifrost
          ecosystem_project: shared
        annotations:
          summary: "Bifrost logs store above 5 GB for 30m"
          description: |
            bifrost_logs_db_bytes = {{ $value | humanize1024 }}B (Postgres
            `bifrost_logs` database size), above the 5 GB warn threshold for
            30 minutes. Steady-state should be similar order of magnitude to
            the old ~9 GB SQLite figure at 2d retention. Confirm Bifrost's
            internal retention cleaner is actually running:
              docker logs shared-bifrost --since 24h | grep -i "log cleanup\|retention cleaner"
            Expect a "starting log cleanup: deleting logs older than ... (retention: 2 days)"
            line roughly daily. If missing, check config.json's
            logs_store.retention_days is still set, and check row counts directly:
              psql -h 127.0.0.1 -U postgres -d bifrost_logs -c "SELECT count(*), min(timestamp), max(timestamp) FROM logs;"
          runbook_url: "https://internal/runbooks/bifrost-logs-db-size"

      - alert: BifrostLogsDbSizeCritical
        expr: bifrost_logs_db_bytes > 15 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: critical
          component: bifrost
          ecosystem_project: shared
        annotations:
          summary: "Bifrost logs store above 15 GB for 5m"
          description: |
            bifrost_logs_db_bytes = {{ $value | humanize1024 }}B (Postgres
            `bifrost_logs` database size), above 15 GB for 5 minutes. This is
            the SAME native PG server ADA/Legion/Zero share — unbounded
            growth here competes with everyone else's disk, not just
            Bifrost's own. This is Postgres, not the old SQLite file: it will
            NOT hit the historical 26 GB corruption failure mode, so there is
            no archive-and-recreate shortcut and no reason to accept data
            loss. Act now:
              1. Confirm the retention cleaner is alive:
                   docker logs shared-bifrost --since 24h | grep -i "log cleanup\|retention cleaner"
              2. If it is stuck or absent, manually prune old rows (adjust
                 the interval to match logs_store.retention_days):
                   psql -h 127.0.0.1 -U postgres -d bifrost_logs -c "DELETE FROM logs WHERE timestamp < now() - interval '2 days';"
                   psql -h 127.0.0.1 -U postgres -d bifrost_logs -c "VACUUM (ANALYZE) logs;"
              3. If growth is from a genuine traffic spike rather than a
                 stuck cleaner, consider whether retention_days=2 is still
                 the right policy before lowering it — do not delete data
                 you might need for an active incident review.
          runbook_url: "https://internal/runbooks/bifrost-logs-db-size"
