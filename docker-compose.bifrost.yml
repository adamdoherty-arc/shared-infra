# Bifrost LLM gateway — side-car to shared-litellm during the rollout.
#
# Why a separate compose file (not folded into docker-compose.vllm.yml):
#   - Rollback is `docker compose -f docker-compose.bifrost.yml down` and
#     touches NOTHING in the chat / embed / litellm stack. The plan calls
#     out 30 days of clean operation before retiring shared-litellm — keep
#     the two gateways orthogonal until then.
#   - Zero project-side changes during Phase 1: callers continue hitting
#     shared-litellm:4444. Only Phase 2 (LEGION_USE_BIFROST canary at 10%)
#     starts sending real traffic at 4445.
#
# Bring up:
#   docker compose -f docker-compose.vllm.yml -f docker-compose.bifrost.yml up -d bifrost
# Bring down:
#   docker compose -f docker-compose.bifrost.yml down
#
# Network: joins the existing `shared-infra_default` network created by
# docker-compose.vllm.yml so it can reach `llama-cpp-chat:8000` and
# `vllm-embed:8001` by service name. We use `external: true` because
# docker-compose.vllm.yml owns the network's lifecycle.
#
# Image pin: v1.5.0 is the first stable (non-prerelease) tag. Verified on
# Docker Hub 2026-05-10: linux/amd64 + linux/arm64 multi-arch manifest,
# pushed 4 days ago. Do NOT float to :latest.

services:
  bifrost:
    image: maximhq/bifrost:v1.5.0
    container_name: shared-bifrost
    networks:
      - shared
    ports:
      # Host 4445 — parallel to shared-litellm (4444) so the two gateways
      # can be A/B'd without env edits on the consumer side. Container
      # listens on 8080 by default (Bifrost APP_PORT).
      - "4445:8080"
    environment:
      APP_PORT: "8080"
      APP_HOST: "0.0.0.0"
      LOG_LEVEL: "info"
      LOG_STYLE: "json"
      # Cloud-provider API keys are passed through; Bifrost reads them
      # from the env when a provider config sets `value: env.<NAME>`.
      # 2026-06-11: moonshot (KIMI_API_KEY) removed — the only paid
      # provider is gone; Kimi K2.6 now routes free via nvidia-nim.
      # The active set is ALL-FREE: vllm-local + embed-local + nvidia-nim
      # + openrouter + hf-router + cerebras + groq + mistral + gemini
      # (flash-only) + zai. Parked recipes: bifrost/disabled-providers.json.
      # When re-enabling one, re-add the matching env passthrough here AND
      # restore the provider block to bifrost/config.json (Bifrost won't
      # pick up new env vars without a container restart).
      NV_API_KEY: ${NV_API_KEY:-}
      # 2026-07-09: second NIM key (developer account) for rotation. Bifrost
      # round-robins across keys defined on the nvidia-nim provider block by
      # `weight`; failing key gets its budget skipped for subsequent calls.
      NV_API_KEY_2: ${NV_API_KEY_2:-}
      # 2026-05-27: re-enabled OpenRouter + added NVIDIA NIM + HF Router provider
      # blocks in config.json. See those provider entries for the model catalogues.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      # 2026-05-31: free-provider lanes. Cerebras keyed + active now;
      # Gemini/Groq/Mistral passed through but their config.json blocks stay
      # parked in disabled-providers.json until real keys are added (empty key
      # would flood the model-discovery loop with validation warnings).
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 2026-06-11: Z.ai (Zhipu) — glm-4.7-flash perpetual free tier.
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      # 2026-07-13: GitHub Models free lane (OpenAI GPT-4.1/4o + DeepSeek-R1 +
      # Llama-3.3-70B via models.github.ai). Token from `gh auth token`. Free
      # tier is LOW rate-limit, so ADA only wires it as a deep fallback tail.
      GITHUB_MODELS_TOKEN: ${GITHUB_MODELS_TOKEN:-}
      # 2026-07-31: freellmapi aggregator (86 models across cloudflare/google/
      # cerebras/groq/nvidia/sambanova/mistral/openrouter). Auth is a single
      # bearer token; the FREELLM_BEARER_TOKEN env var is set in shared-infra/.env
      # and referenced by config.json's freellmapi provider block as
      # `env.FREELLM_BEARER_TOKEN`.
      FREELLM_BEARER_TOKEN: ${FREELLM_BEARER_TOKEN:-}
    volumes:
      # Bifrost expects its config directory at /app/data — that's where
      # config.json lives, plus any persistence (logs, governance state).
      # Bind-mount the whole bifrost/ folder so config edits + restart
      # are the only loop needed to roll changes.
      - ./bifrost:/app/data
    deploy:
      resources:
        limits:
          # Plan-479 (2026-06-15): bumped 512M -> 1G. Pre-fix runtime was at
          # 97% of 512M (496.9 MiB) — one allocation from OOMKill. Bifrost
          # buffers in-flight requests + holds the SQLite logs.db handle +
          # provider model caches; 512M was undersized for the 5-project
          # traffic (ADA + Legion + Zero each backend + scheduler probing
          # /v1/models every ~8s). The bifrost-metrics sidecar's stalled
          # cursor (no new rows in 9000+ scrapes as of 2026-06-15 20:00) was
          # GUESSED here as "logs.db write-buffer pressure under tight
          # memory" — Fix-1000157 (2026-07-18) found the REAL cause: logs.id
          # is a UUID varchar (no INTEGER PRIMARY KEY), so bifrost-logs-
          # pruner's nightly DELETE+VACUUM renumbers the table's implicit
          # ROWID per SQLite semantics, permanently stranding the exporter's
          # persisted ROWID cursor above the new (smaller) max ROWID. Not a
          # memory issue at all — fixed in bifrost-metrics-exporter/exporter.py
          # by switching the cursor to the `timestamp` column (VACUUM-immune).
          # Fix-100418 followup (2026-06-16): 20h uptime hit 97% of 1G again
          # (999.4 MiB), same one-allocation-from-OOMKill posture. Same
          # workload — bifrost just needs more headroom under sustained
          # multi-project load. Bumped 1G -> 2G; CPU also doubled to 1.0
          # since the metrics export + provider-discovery loops are CPU-
          # light but were ceiling-clipped under spikes.
          # Fix-1000157 (2026-07-18): CPU doubled again, 1.0 -> 2.0. Container
          # startup log showed "maxprocs: Updating GOMAXPROCS=1: determined
          # from CPU quota" — the Go runtime had exactly ONE OS thread/P to
          # service HTTP request handling, JSON marshaling, AND the
          # synchronous per-request SQLite write into logs.db (32.5 KB/row
          # avg: full raw_request/raw_response/input_history text blobs).
          # A slow write (logs.db is bind-mounted from the Windows host
          # filesystem — measured ~3x slower fsync latency than the
          # container's native overlay fs) had no second P to fall back on,
          # so it could stall concurrent request dispatch. Cheap, safe,
          # reversible; does not touch the vLLM engine's own seqs=1 GPU-KMD
          # wedge mitigation (see docker-compose.vllm.yml — that is a
          # separate, already deeply-diagnosed hardware/kernel issue).
          memory: 2G
          cpus: "2.0"
    restart: unless-stopped
    healthcheck:
      # Keep Docker health focused on gateway liveness. Bifrost's aggregate
      # /v1/models route can block behind provider discovery while /health and
      # inference remain available; ADA performs model-level checks separately.
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 --timeout=5 http://localhost:8080/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  bifrost-metrics:
    # Sidecar Prometheus exporter — bifrost v1.5.0's vendor image doesn't
    # ship the upstream prometheus plugin ("plugin not found, skipping
    # telemetry middleware" at startup). Rather than rebuild bifrost with
    # the plugin, this sidecar tails the SQLite logs.db that Bifrost
    # already writes and re-exports the same shape as the missing plugin.
    # Adds: bifrost_requests_total, bifrost_request_latency_ms histogram,
    # token / cost counters, and config gauges (active providers, vks).
    # ada-prometheus and legion-prometheus both scrape this at :9100.
    build:
      context: ./bifrost-metrics-exporter
      dockerfile: Dockerfile
    image: shared-infra/bifrost-metrics-exporter:1.0
    container_name: bifrost-metrics
    depends_on:
      - bifrost
    networks:
      - shared
    ports:
      # Host 9102 — zero-minio holds 9100, zero-minio-console holds 9101.
      # Container listens on 9100; scrape config uses bifrost-metrics:9100
      # inside the shared docker network.
      - "9102:9100"
    environment:
      BIFROST_LOGS_DB: "/data/logs.db"
      BIFROST_CONFIG_DB: "/data/config.db"
      EXPORTER_STATE_DIR: "/state"
      EXPORTER_INTERVAL_S: "15"
      EXPORTER_PORT: "9100"
      # Active lane prober (2026-06-20): actively pings each provider/model
      # lane through the gateway and emits bifrost_lane_up so a silently-dead
      # lane (expired key, wedged pool, delisted model) becomes alertable.
      # Reaches bifrost by service name; VK auto-read from config.db (no secret
      # here). Set BIFROST_LANE_PROBE_ENABLED=0 to disable.
      BIFROST_LANE_PROBE_ENABLED: "1"
      BIFROST_PROBE_BASE: "http://shared-bifrost:8080"
      BIFROST_PROBE_TIMEOUT_S: "15"
    volumes:
      # Read-only mount of the bifrost data directory so the exporter can
      # query logs.db + config.db without holding write locks on bifrost.
      - ./bifrost:/data:ro
      - bifrost-metrics-state:/state
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.10"
    restart: unless-stopped
    healthcheck:
      # Use 127.0.0.1 not localhost: busybox wget resolves "localhost"
      # to IPv6 ::1 but Python's HTTPServer binds IPv4 only.
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 --timeout=3 http://127.0.0.1:9100/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  bifrost-logs-pruner:
    # Nightly pruner for Bifrost logs.db.  Without retention the file
    # grows without bound (reached 8.3 GB corrupt on 2026-06-11, 11.95 GB
    # on 2026-07-13 — headed for the 26 GB corruption threshold).
    # Runs DELETE + VACUUM at 03:00 UTC.  Retention dropped from 7d to 2d
    # on 2026-07-13: LLM traffic grew to ~4.5 GB/day (140K rows/day at 32.5
    # KB/row average of full request+response payload), so 7d retention
    # would sustain a 30 GB DB that will corrupt at ~26 GB.  2d keeps the
    # DB at ~9 GB steady-state, with a comfortable margin.
    # Mounts bifrost/ read-WRITE so it can modify logs.db directly.
    # No network access needed — pure local SQLite operation.
    build:
      context: ./bifrost-logs-pruner
      dockerfile: Dockerfile
    image: shared-infra/bifrost-logs-pruner:1.0
    container_name: bifrost-logs-pruner
    depends_on:
      - bifrost
    volumes:
      # Read-WRITE mount (unlike the exporter which is :ro).
      - ./bifrost:/data
    environment:
      BIFROST_LOGS_DB: "/data/logs.db"
      LOGS_RETENTION_DAYS: "2"
      PRUNE_HOUR_UTC: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.05"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  bifrost-autoheal:
    # Auto-park any Bifrost provider with SUSTAINED auth failures (2026-07-08).
    # A single dead key (expired / revoked / wrong project) otherwise floods the
    # gateway forever via the per-minute model-discovery loop (this is exactly
    # what the Gemini lane did on 2026-07-08 before it was parked by hand).
    # This sidecar detects that from `docker logs shared-bifrost` and runs the
    # same 5-step park procedure a human would (snapshot -> move block
    # config.json->disabled-providers.json -> deregister config.db -> stop +
    # sync_vk_allowlists + start -> alert). Mirrors the vllm-autoheal /
    # vllm-wedge-monitor pattern: stock python:3.12-slim, stdlib-only script
    # over the Docker socket, no image build. See bifrost/auth_autoheal.py for
    # the full rationale + false-positive guards (active-only, MIN_HITS floor,
    # protected local lanes never parked).
    image: python:3.12-slim
    container_name: bifrost-autoheal
    depends_on:
      - bifrost
    working_dir: /work/bifrost
    command: ["python", "-u", "/work/bifrost/auth_autoheal.py"]
    environment:
      AUTOHEAL_INTERVAL_S: "60"          # poll cadence
      AUTOHEAL_WINDOW_S: "300"           # lookback window for the hit count
      AUTOHEAL_MIN_HITS: "6"             # sustained floor before parking
      AUTOHEAL_DRY_RUN: "false"          # true = detect + log only
      AUTOHEAL_PROTECTED: "vllm-local,embed-local"   # local lanes never parked
      # Leave Bifrost's built-in pricing datasheet alone (repo policy in
      # CLAUDE.md + bifrost/README.md); set true to also purge pricing rows.
      AUTOHEAL_PURGE_PRICING: "false"
      AUTOHEAL_BIFROST_CONTAINER: "shared-bifrost"
      AUTOHEAL_BIFROST_DIR: "/work/bifrost"
      # Optional Discord alerting; set AUTOHEAL_DISCORD_WEBHOOK in shared-infra/.env
      AUTOHEAL_DISCORD_WEBHOOK: "${AUTOHEAL_DISCORD_WEBHOOK:-}"
      # ── synthetic completion probe (2026-07-29) ──────────────────────────
      # The auth pass above only reads log lines, so it is blind to the
      # pool-exhaustion hang: on 2026-07-25 and again on 2026-07-29 the gateway
      # held every completion open indefinitely (>180s, and 4.9h in the first
      # incident) while vLLM answered a direct call in seconds and
      # /health/liveliness kept returning 200. Nothing in the mesh noticed,
      # because liveliness cannot tell "up" from "can actually complete".
      # This probe sends a real 1-token completion down the local vLLM lane each
      # pass and restarts the gateway after PROBE_FAIL_STREAK consecutive
      # failures -- but only when the upstream is healthy, so an upstream outage
      # never flaps the gateway.
      AUTOHEAL_PROBE: "true"
      # MUST be provider/model. A bare name 400s at the router, which the probe
      # counts as "responsive" -- it would then pass forever without ever
      # exercising the completion path.
      AUTOHEAL_PROBE_MODEL: "vllm-local/qwen3-chat"
      AUTOHEAL_PROBE_PROVIDER: "vllm-local"
      AUTOHEAL_PROBE_BASE: "http://shared-bifrost:8080"
      # The upstream is probed by COMPLETING, not by listing models: vllm-chat
      # runs max_num_seqs=1 and this lane is concurrency=1, so one long
      # generation legitimately blocks it (a 651-SECOND completion was observed
      # while vLLM was healthily producing 54 tok/s). /v1/models answers
      # instantly throughout that, which would read as "gateway hung".
      AUTOHEAL_PROBE_UPSTREAM_BASE: "http://vllm-chat:8000"
      AUTOHEAL_PROBE_UPSTREAM_MODEL: "qwen3-chat"
      AUTOHEAL_PROBE_UPSTREAM_TIMEOUT_S: "60"
      # NOT a latency SLO -- only has to separate "slow" from "never". 45s was
      # tried and sat inside the normal spread (observed healthy completions:
      # 0.3s, 13.3s, 19.9s, 21.2s, 32.5s, 36.6s), so the probe kept reaching its
      # restart condition on a merely-slow gateway.
      AUTOHEAL_PROBE_TIMEOUT_S: "120"
      AUTOHEAL_PROBE_FAIL_STREAK: "3"      # ~6 min of confirmed hang before acting
      AUTOHEAL_PROBE_COOLDOWN_S: "1800"    # never restart-loop / never alert-spam
      # Detect + alert only. The recurring stall is CAPACITY (vllm max_num_seqs=1
      # behind a concurrency=1 lane, so one long generation blocks every project),
      # not a leak -- restarting aborts real work and buys ~15 min. Flip to
      # "restart" once the lane concurrency question is settled.
      AUTOHEAL_PROBE_ACTION: "alert"
      # Virtual key is read live from config.db (read-only, existing mount);
      # set a name here only to pin a specific one.
      AUTOHEAL_PROBE_VK: "${AUTOHEAL_PROBE_VK:-}"
    volumes:
      # Docker socket so it can read shared-bifrost's logs + stop/start it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-WRITE mount of the bifrost dir: it edits config.json /
      # disabled-providers.json / config.db and writes autoheal.log here.
      - ./bifrost:/work/bifrost
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.10"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared:
    name: shared-infra_default
    external: true

volumes:
  bifrost-metrics-state:
    name: shared-bifrost-metrics-state
